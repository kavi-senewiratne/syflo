<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Syflo App-Icon-Master (Ink Blue, Desktop/Electron — Standard-Icon, zur
       Build-Zeit eingebrannt; die Theme-Varianten liegen als
       design/app-icon-<theme>.svg daneben). Final aus Runde 6: Verlaufs-Kachel
       mit Lichtkante, Marke wie im Sidebar-Logo (Navy-Strom, blauer Start,
       grüner Akzent, blauer unterer Knoten). Proportionen aus der 96px-Kachel.
       Design source: design/mockup-logo-icons-round6.html (Ink Blue, V1).
       ACHTUNG: icon.png/.icns werden NICHT aus diesem SVG erzeugt, sondern
       als pixelgenauer Capture der Ink-V1-Dock-Kachel direkt aus dem
       round6-Mockup (Nutzerwunsch 2026-07-24). Dieses SVG ist nur die
       Vektor-Referenz. -->
  <defs>
    <linearGradient id="ink-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B9BFF"/>
      <stop offset="48%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2E6BE0"/>
    </linearGradient>
  </defs>
  <!-- Offset-Schatten -->
  <rect x="132" y="112" width="800" height="800" rx="200" fill="rgba(28,43,74,0.9)"/>
  <!-- Kachel -->
  <rect x="92" y="72" width="800" height="800" rx="200" fill="url(#ink-tile)" stroke="#1C2B4A" stroke-width="25"/>
  <!-- Lichtkante oben -->
  <rect x="172" y="108" width="640" height="33" rx="16" fill="#FFFFFF" opacity="0.35"/>
  <!-- Sidebar-Marke: 483px zentriert auf (492, 472) -->
  <g transform="translate(252, 232) scale(10)">
    <path d="M11 24 H 22 C 28 24, 29 15, 36 13" stroke="#1C2B4A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M22 24 C 28 24, 29 33, 36 35" stroke="#1C2B4A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <circle cx="7" cy="24" r="5" fill="#3B82F6" stroke="#1C2B4A" stroke-width="3"/>
    <circle cx="39" cy="12.5" r="5.5" fill="#34D399" stroke="#1C2B4A" stroke-width="3"/>
    <circle cx="39" cy="35.5" r="5.5" fill="#3B82F6" stroke="#1C2B4A" stroke-width="3"/>
  </g>
</svg>
