<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Syflo App-Icon, Basic (Dock/Schreibtisch, 1024er-Canvas mit
       Transparenzrand). INVERTIERT: Variante I2 + Markengröße G88.
       Design source: design/mockup-logo-simply-blue-inverted.html
       (Wahl 2026-09-12: erst „I1 mit G80", dann G88, dann Wechsel
       des Materials auf I2 — Stand in Erprobung)

       I2 (löst Material D4 ab, das seit Runde 13 die blaue Kachel trug):
       die Farben sind vertauscht — die Kachel trägt das D4-Material ins
       Weiße übersetzt, die Marke ist blue-600. Konkret:

         1. senkrechter Verlauf #FFFFFF → #F4F7FC → #E9EFF8 (derselbe
            Hell-nach-Dunkel-Gang wie D4, nur im Weißbereich);

         2. der 22er INNENRAND bleibt, aber die weiße Lichtkante oben
            ist auf weißem Grund unsichtbar — die Materialstärke trägt
            allein die Abdunklung unten, blue-900 bei 18 % statt 45 %.

       Kontur (25) und Offset-Schatten (50 nach rechts unten) bleiben
       blue-800 — Entscheidung aus Runde 10: jedes Theme zieht beides
       aus der eigenen Farbe.

       G88: die Marke steht auf Maßstab 9.5 statt 10.8 (zwölf Prozent
       kleiner; Stufen G94–G56 im Mockup §03 verglichen, G80 war einen
       Tag lang gewählt und wirkte zu klein). Tintenbreite
       42.5 × 9.5 ≈ 404 von 800 sichtbarer Kachel (50 %) — bewusst
       etwas unter den ~54 % der vier anderen Theme-Icons. Der
       Ankerpunkt ist unverändert (492|472), die Boxmitte der Tinte
       liegt bei (26.5|24) in Markenkoordinaten:
         translate x = 492 − 26.5 × 9.5 = 240.25 · y = 472 − 24 × 9.5 = 244

       Marke R2 unverändert (Runde 11): Knoten sind RINGE (Loch offen,
       Wand 4 Einheiten) auf (41.77|11.35) und (41.77|36.65); durch die
       offenen Löcher scheint die Kachel.

       Der Innenrand ist wie bei D4 EIN Strich mit Farbverlauf, nicht
       zwei geclippte Hälften (Nachtrag 2026-08-25: zwei Hälften
       erzeugen im gerasterten PNG eine harte Stufe auf halber Höhe).

       Bewusst OHNE Weichzeichner-Filter gebaut — nur Verläufe,
       Konturen und Pfade, damit librsvg das Icon zuverlässig rastert.

       Regenerieren: rsvg-convert -w 1024 -h 1024 (transparenter Grund)
       → electron/assets/icon-professional.png -->

  <defs>
    <linearGradient id="tileFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F4F7FC"/>
      <stop offset="100%" stop-color="#E9EFF8"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="42%"  stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="58%"  stop-color="#1E3A8A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- harter Offset-Schatten, 50px nach rechts unten, in blue-800 -->
  <rect x="142" y="122" width="800" height="800" rx="200" fill="#1E40AF"/>

  <!-- Kachel: weißer Verlauf, die 25er Kontur liegt innen auf der Kante -->
  <rect x="104.5" y="84.5" width="775" height="775" rx="187.5"
        fill="url(#tileFill)" stroke="#1E40AF" stroke-width="25"/>

  <!-- Innenrand: oben unsichtbares Licht, unten sanfter Schatten -->
  <rect x="128" y="108" width="728" height="728" rx="164"
        fill="none" stroke="url(#rim)" stroke-width="22"/>

  <!-- Marke R2 in blue-600, Maßstab 9.5 (G88). Die Löcher der Ringe
       bleiben ungefüllt: dort scheint die Kachel durch. -->
  <g transform="translate(240.25, 244) scale(9.5)">
    <path d="M11 24 H 22 C 28 24, 29 15, 36 13" stroke="#2563EB" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M22 24 C 28 24, 29 33, 36 35" stroke="#2563EB" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="8" cy="24" r="4" fill="#2563EB"/>
    <circle cx="41.77" cy="11.35" r="5.5" fill="none" stroke="#2563EB" stroke-width="4"/>
    <circle cx="41.77" cy="36.65" r="5.5" fill="none" stroke="#2563EB" stroke-width="4"/>
  </g>
</svg>
