<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-labelledby="t d">
  <title id="t">One long chat versus a tree of branches</title>
  <desc id="d">Left: one long chat where all six messages — the paper, attention, GPU memory, positional encodings, back to attention, why several heads — are sent again on every turn, shown in red. Right: the Syflo tree, where the paper is sent as a summary, attention in full, the question being typed, and GPU memory not at all — three pieces, not six, shown in green.</desc>

  <style>
    /* Sent = green, resent ballast = red; base tones from the Mushroom Kingdom palette. */
    .plate { fill: #fefcf3; }
    .ink   { fill: #282855; }
    .mut   { fill: #9c97a8; }
    .red   { fill: #d94a3d; }
    .green { fill: #2f9e44; }
    .gray  { fill: #8d88a0; }
    .rule  { stroke: #c8c3ad; }
    .branch{ stroke: #c8c3ad; fill: none; stroke-width: 1.5; }

    @media (prefers-color-scheme: dark) {
      .plate { fill: #20224f; }
      .ink   { fill: #f3f0e0; }
      .mut   { fill: #8b8fb4; }
      .red   { fill: #e8695d; }
      .green { fill: #58b368; }
      .gray  { fill: #8b8fb4; }
      .rule  { stroke: #464a80; }
      .branch{ stroke: #464a80; }
    }
  </style>

  <rect class="plate" x="0" y="0" width="660" height="300" rx="14"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5">
    <!-- ── left: one long chat ── -->
    <text class="ink" x="140" y="22" text-anchor="middle" font-weight="600">One long chat</text>
    <text class="mut" x="140" y="40" text-anchor="middle">every message, every turn</text>
    <g>
      <rect x="72" y="56" width="136" height="24" rx="6" fill="#d94a3d" opacity="0.26"/>
      <rect x="72" y="86" width="136" height="24" rx="6" fill="#d94a3d" opacity="0.26"/>
      <rect x="72" y="116" width="136" height="24" rx="6" fill="#d94a3d" opacity="0.26"/>
      <rect x="72" y="146" width="136" height="24" rx="6" fill="#d94a3d" opacity="0.26"/>
      <rect x="72" y="176" width="136" height="24" rx="6" fill="#d94a3d" opacity="0.26"/>
      <rect x="72" y="206" width="136" height="24" rx="6" fill="#d94a3d" opacity="0.26"/>
      <text class="ink" x="140" y="72" text-anchor="middle">the paper</text>
      <text class="ink" x="140" y="102" text-anchor="middle">attention</text>
      <text class="ink" x="140" y="132" text-anchor="middle">GPU memory</text>
      <text class="ink" x="140" y="162" text-anchor="middle">positional encodings</text>
      <text class="ink" x="140" y="192" text-anchor="middle">back to attention?</text>
      <text class="ink" x="140" y="222" text-anchor="middle">why several heads?</text>
    </g>
    <text class="red" x="140" y="262" text-anchor="middle" font-weight="600">all six are sent, every time</text>

    <line class="rule" x1="330" y1="28" x2="330" y2="272" stroke-dasharray="4 4"/>

    <!-- ── right: a tree of branches ── -->
    <text class="ink" x="500" y="22" text-anchor="middle" font-weight="600">A tree of branches</text>
    <text class="mut" x="500" y="40" text-anchor="middle">only the path back to the root</text>
    <g class="branch">
      <path d="M500 88 V 112 M420 112 H 580 M420 112 V 138 M580 112 V 138"/>
      <path d="M420 164 V 190 M420 190 H 420 M420 190 V 196"/>
    </g>
    <rect x="440" y="58" width="120" height="30" rx="6" fill="#2f9e44" opacity="0.28"/>
    <text class="ink" x="500" y="77" text-anchor="middle">the paper</text>
    <text class="green" x="500" y="103" text-anchor="middle" font-size="10.5">sent as a summary</text>

    <rect x="362" y="138" width="116" height="26" rx="6" fill="#2f9e44" opacity="0.28"/>
    <text class="ink" x="420" y="155" text-anchor="middle">attention</text>
    <text class="green" x="420" y="178" text-anchor="middle" font-size="10.5">sent in full</text>

    <rect x="522" y="138" width="116" height="26" rx="6" fill="#adb5bd" opacity="0.28"/>
    <text class="gray" x="580" y="155" text-anchor="middle">GPU memory</text>
    <text class="gray" x="580" y="178" text-anchor="middle" font-size="10.5">not sent</text>

    <rect x="358" y="196" width="124" height="30" rx="6" fill="#2f9e44" opacity="0.45"/>
    <text class="ink" x="420" y="215" text-anchor="middle" font-weight="600">why several heads?</text>
    <text class="green" x="500" y="262" text-anchor="middle" font-weight="600">three pieces, not six</text>
  </g>
</svg>
