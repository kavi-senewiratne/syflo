<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Hyrule favicon — parchment tile with gold border, teal stream, two
       gold diamonds. Same tile geometry as every other theme.
       Design source: design/mockup-logo-icons-round6.html (Hyrule, round 7)
       and Logo.tsx (hyrule) — "teal stream, two gold diamonds, no start node".
       Was out of sync until 2026-08-02: this file still carried the round-1
       mark (two round nodes, one of them teal), so the browser tab showed a
       different logo than the dock icon (electron/assets/icon-hyrule.png). -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="10" fill="#FCFBF2" stroke="#B8963A" stroke-width="2.5"/>
  <path d="M8 24 H 22 C 28 24, 29 15, 36 13" stroke="#2AA198" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M22 24 C 28 24, 29 33, 36 35" stroke="#2AA198" stroke-width="5" stroke-linecap="round" fill="none"/>
  <rect x="32.4" y="7.9" width="9.2" height="9.2" transform="rotate(45 37 12.5)" fill="#B8963A"/>
  <rect x="32.4" y="30.9" width="9.2" height="9.2" transform="rotate(45 37 35.5)" fill="#B8963A"/>
</svg>
